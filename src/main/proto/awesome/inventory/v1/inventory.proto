syntax = "proto3";

package awesome.inventory.v1;
option java_package = "com.awesome.testing.grpc.proto";
option java_multiple_files = true;

// All inventory RPCs require a current application JWT with ROLE_ADMIN.
// Reserve removed field numbers and names; never reuse tags in this v1 contract.
service InventoryService {
  rpc GetStock(GetStockRequest) returns (InventoryItem);
  rpc ListInventory(ListInventoryRequest) returns (InventoryPage);
  // Retry an uncertain result with the same product, request_id, delta and reason.
  rpc AdjustStock(AdjustStockRequest) returns (StockMovement);
  rpc ListStockMovements(ListStockMovementsRequest) returns (MovementPage);
}

message GetStockRequest {
  int64 product_id = 1;
  optional int32 low_stock_threshold = 2; // Absent means 10; explicit zero is invalid.
}
message ListInventoryRequest {
  optional int32 page = 1; // Absent means 0.
  optional int32 size = 2; // Absent means 20; accepted range 1..100.
  optional string search = 3;
  optional string category = 4;
  optional StockStatus status = 5; // Absent means no filter; unspecified is invalid.
  optional int32 low_stock_threshold = 6;
}
message AdjustStockRequest {
  int64 product_id = 1;
  int32 delta = 2; // Must be nonzero.
  string reason = 3; // Nonblank, at most 500 characters.
  string request_id = 4; // Canonical UUID, scoped to product_id.
}
message ListStockMovementsRequest {
  int64 product_id = 1;
  optional int32 page = 2;
  optional int32 size = 3;
}
enum StockStatus {
  STOCK_STATUS_UNSPECIFIED = 0;
  IN_STOCK = 1;
  LOW_STOCK = 2;
  OUT_OF_STOCK = 3;
}
message InventoryItem {
  int64 product_id = 1;
  string name = 2;
  optional string category = 3;
  int32 available_quantity = 4;
  StockStatus stock_status = 5;
  optional string last_changed_at = 6; // Server-local ISO date-time, matching REST.
}
message InventoryPage {
  repeated InventoryItem items = 1;
  int64 total = 2;
  int32 page = 3;
  int32 size = 4;
}
message StockMovement {
  int64 id = 1;
  int64 product_id = 2;
  optional int64 order_id = 3;
  string type = 4;
  int32 delta = 5;
  int32 quantity_after = 6;
  optional string actor = 7;
  optional string reason = 8;
  optional string request_id = 9;
  string created_at = 10; // Server-local ISO date-time, matching REST.
}
message MovementPage {
  repeated StockMovement items = 1;
  int64 total = 2;
  int32 page = 3;
  int32 size = 4;
}
