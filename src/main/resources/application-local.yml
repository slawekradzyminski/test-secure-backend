spring:
  # PostgreSQL with the same Flyway migrations as production; override with SPRING_DATASOURCE_*.
  datasource:
    url: jdbc:postgresql://localhost:5432/testdb
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    validate-migration-naming: true
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        id:
          new_generator_mappings: false
  jackson:
    serialization:
      indent-output: true

activemq:
  destination: email

server:
  port: 4001
  error:
    include-message: always
    include-binding-errors: always

security:
  jwt:
    token:
      signing-key: ${JWT_SIGNING_KEY:}
      expire-length: 3600000

management:
  endpoints:
    web:
      exposure:
        include: "*"

logging:
  level:
    root: INFO
    org.zalando.logbook: TRACE
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n" 

ollama:
  base-url: http://localhost:11434 

warehouse:
  service-token: ${WAREHOUSE_SERVICE_TOKEN:local-warehouse-token}

password-reset:
  frontend-base-url: http://localhost:8081/reset
  token-ttl: 30m
  token-byte-length: 32
  expose-token-in-response: true
  local-outbox-enabled: true

app:
  email:
    transport: local-outbox
  seed-demo-data:
    enabled: true
