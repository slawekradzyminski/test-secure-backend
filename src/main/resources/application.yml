# Every packaged profile shares one bean graph: GraphQL, gRPC and both email transports are
# always wired, and profiles only change properties. GraalVM native images freeze bean
# selection at build time, so nothing here may depend on the active profile.
spring:
  grpc:
    server:
      enabled: true
      address: ${GRPC_HOST:127.0.0.1}
      port: ${GRPC_PORT:9091}
      inbound:
        message:
          max-size: 64KB
      # Fixed at build time in the native image; keep it off in every environment.
      reflection:
        enabled: false
  graphql:
    schema:
      locations: classpath:graphql-preview/**/
    http:
      path: /api/v1/graphql
    graphiql:
      enabled: true
      path: /api/v1/graphiql
  main:
    allow-bean-definition-overriding: true
  jpa:
    open-in-view: false
  servlet:
    multipart:
      # The CSV import accepts 1 MB; the extra headroom lets the service answer with a precise 413 message.
      max-file-size: 2MB
      max-request-size: 2MB
  # Every runtime profile migrates with Flyway; the unit-test profile switches it off. Must be true
  # here because the native image decides whether Flyway exists at build time.
  flyway:
    enabled: true

server:
  # Swagger UI in browsers can include large Cookie/Authorization headers; keep headroom above Tomcat defaults.
  max-http-request-header-size: 64KB
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

logging:
  file:
    name: logs/application.log
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  level:
    root: INFO
    com.awesome.testing: DEBUG
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.zalando.logbook: INFO

logbook:
  # GraphQL operation metrics come from observations; do not log raw queries.
  predicate:
    exclude:
      - path: /api/v1/graphql
  include: "/**"
  exclude: 
    - "/swagger-ui/**"
    - "/v3/api-docs"
    - "/v3/api-docs.yaml"
    - "/v3/api-docs/**"
    - "/actuator/**"
    - "/favicon.ico"
    - "/api/v1/ollama/generate"
    - "/api/v1/ollama/chat/**"
    - "/api/v1/users/2fa/**"
    - "/api/v1/users/signin/2fa"
    - "/internal/**"
  format:
    style: json
  write:
    chunk-size: 1000
  filter.enabled: true
  obfuscate:
    headers:
      - authorization
      - x-secret
      - x-service-token
      - cookie
    json-body-fields:
      - password
      - newPassword
      - confirmPassword
      - token
      - refreshToken
      - accessToken
      - challengeToken
      - code
      - secret
      - otpAuthUri
      - qrCodeDataUri
      - recoveryCodes

security:
  jwt:
    token:
      require-secure-key: ${JWT_REQUIRE_SECURE_KEY:false}
    refresh-token:
      legacy-uuid-format: ${JWT_REFRESH_TOKEN_LEGACY_UUID_FORMAT:false}
  rate-limit:
    enabled: ${SECURITY_RATE_LIMIT_ENABLED:false}
    trust-forwarded-headers: ${SECURITY_RATE_LIMIT_TRUST_FORWARDED_HEADERS:false}
    cache:
      maximum-size: ${SECURITY_RATE_LIMIT_CACHE_MAXIMUM_SIZE:10000}
      expire-after-access: ${SECURITY_RATE_LIMIT_CACHE_EXPIRE_AFTER_ACCESS:1h}
    policies:
      signup-ip:
        capacity: ${SECURITY_RATE_LIMIT_SIGNUP_IP_CAPACITY:10}
        window: ${SECURITY_RATE_LIMIT_SIGNUP_IP_WINDOW:1h}
      signin-ip:
        capacity: ${SECURITY_RATE_LIMIT_SIGNIN_IP_CAPACITY:20}
        window: ${SECURITY_RATE_LIMIT_SIGNIN_IP_WINDOW:5m}
      signin-username:
        capacity: ${SECURITY_RATE_LIMIT_SIGNIN_USERNAME_CAPACITY:10}
        window: ${SECURITY_RATE_LIMIT_SIGNIN_USERNAME_WINDOW:15m}
      signin-ip-username:
        capacity: ${SECURITY_RATE_LIMIT_SIGNIN_IP_USERNAME_CAPACITY:5}
        window: ${SECURITY_RATE_LIMIT_SIGNIN_IP_USERNAME_WINDOW:5m}
      mfa-ip:
        capacity: ${SECURITY_RATE_LIMIT_MFA_IP_CAPACITY:10}
        window: ${SECURITY_RATE_LIMIT_MFA_IP_WINDOW:5m}
      mfa-challenge:
        capacity: ${SECURITY_RATE_LIMIT_MFA_CHALLENGE_CAPACITY:5}
        window: ${SECURITY_RATE_LIMIT_MFA_CHALLENGE_WINDOW:5m}
      mfa-user:
        capacity: ${SECURITY_RATE_LIMIT_MFA_USER_CAPACITY:20}
        window: ${SECURITY_RATE_LIMIT_MFA_USER_WINDOW:15m}
      password-forgot-ip:
        capacity: ${SECURITY_RATE_LIMIT_PASSWORD_FORGOT_IP_CAPACITY:10}
        window: ${SECURITY_RATE_LIMIT_PASSWORD_FORGOT_IP_WINDOW:15m}
      password-forgot-identifier:
        capacity: ${SECURITY_RATE_LIMIT_PASSWORD_FORGOT_IDENTIFIER_CAPACITY:3}
        window: ${SECURITY_RATE_LIMIT_PASSWORD_FORGOT_IDENTIFIER_WINDOW:30m}
      password-reset-ip:
        capacity: ${SECURITY_RATE_LIMIT_PASSWORD_RESET_IP_CAPACITY:10}
        window: ${SECURITY_RATE_LIMIT_PASSWORD_RESET_IP_WINDOW:15m}
      refresh-ip:
        capacity: ${SECURITY_RATE_LIMIT_REFRESH_IP_CAPACITY:60}
        window: ${SECURITY_RATE_LIMIT_REFRESH_IP_WINDOW:15m}
      email-user:
        capacity: ${SECURITY_RATE_LIMIT_EMAIL_USER_CAPACITY:30}
        window: ${SECURITY_RATE_LIMIT_EMAIL_USER_WINDOW:15m}
      qr-user:
        capacity: ${SECURITY_RATE_LIMIT_QR_USER_CAPACITY:60}
        window: ${SECURITY_RATE_LIMIT_QR_USER_WINDOW:15m}
      ollama-user:
        capacity: ${SECURITY_RATE_LIMIT_OLLAMA_USER_CAPACITY:20}
        window: ${SECURITY_RATE_LIMIT_OLLAMA_USER_WINDOW:5m}
      ollama-ip:
        capacity: ${SECURITY_RATE_LIMIT_OLLAMA_IP_CAPACITY:20}
        window: ${SECURITY_RATE_LIMIT_OLLAMA_IP_WINDOW:5m}

app:
  email:
    # jms (Artemis, default) or local-outbox (in-memory outbox, no broker).
    transport: jms
    # Re-sends tracked emails that failed or were lost in a restart (see EmailRetryJob).
    retry:
      enabled: ${APP_EMAIL_RETRY_ENABLED:true}
      interval: ${APP_EMAIL_RETRY_INTERVAL:PT1M}
  mfa:
    issuer: ${APP_MFA_ISSUER:Awesome Testing}
    encryption-password: ${APP_MFA_ENCRYPTION_PASSWORD:local-development-mfa-key-change-me}
    encryption-salt: ${APP_MFA_ENCRYPTION_SALT:8f9c82cf1d4a63b107a82fc60e0c27ab}
    require-secure-encryption: ${APP_MFA_REQUIRE_SECURE_ENCRYPTION:false}
    challenge-ttl: ${APP_MFA_CHALLENGE_TTL:5m}
    setup-ttl: ${APP_MFA_SETUP_TTL:15m}
    period: 30s
    adjacent-time-steps: 1
    secret-bits: 160
    recovery-code-count: 8
    challenge-token-bytes: 32
  seed-demo-data:
    enabled: false
  bootstrap-admin:
    enabled: ${APP_BOOTSTRAP_ADMIN_ENABLED:false}
    username: ${APP_BOOTSTRAP_ADMIN_USERNAME:}
    password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:}
    email: ${APP_BOOTSTRAP_ADMIN_EMAIL:}
    first-name: ${APP_BOOTSTRAP_ADMIN_FIRST_NAME:Admin}
    last-name: ${APP_BOOTSTRAP_ADMIN_LAST_NAME:User}
  bootstrap-products:
    enabled: ${APP_BOOTSTRAP_PRODUCTS_ENABLED:false}
    catalog: ${APP_BOOTSTRAP_PRODUCTS_CATALOG:classpath:bootstrap/products.json}
  sso:
    enabled: ${APP_SSO_ENABLED:true}
    auth-provider: ${APP_SSO_AUTH_PROVIDER:keycloak}
    issuer-uri: ${APP_SSO_ISSUER_URI:http://localhost:8082/realms/awesome-testing}
    jwk-set-uri: ${APP_SSO_JWK_SET_URI:http://localhost:8082/realms/awesome-testing/protocol/openid-connect/certs}
    audience: ${APP_SSO_AUDIENCE:awesome-testing-frontend}
    username-claim: ${APP_SSO_USERNAME_CLAIM:preferred_username}
    email-claim: ${APP_SSO_EMAIL_CLAIM:email}
    first-name-claim: ${APP_SSO_FIRST_NAME_CLAIM:given_name}
    last-name-claim: ${APP_SSO_LAST_NAME_CLAIM:family_name}
  cors:
    allowed-origin-patterns: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:8081,http://127.0.0.1:8081,http://host.docker.internal:8081}
  traffic:
    event-queue-capacity: ${APP_TRAFFIC_EVENT_QUEUE_CAPACITY:1000}
    persistence-queue-capacity: ${APP_TRAFFIC_PERSISTENCE_QUEUE_CAPACITY:1000}
    persistence-batch-size: ${APP_TRAFFIC_PERSISTENCE_BATCH_SIZE:100}
    persistence-flush-interval: ${APP_TRAFFIC_PERSISTENCE_FLUSH_INTERVAL:100}
    max-body-length: ${APP_TRAFFIC_MAX_BODY_LENGTH:4000}
    max-page-size: ${APP_TRAFFIC_MAX_PAGE_SIZE:100}
    retention: ${APP_TRAFFIC_RETENTION:P1D}
    cleanup-interval: ${APP_TRAFFIC_CLEANUP_INTERVAL:PT24H}
    obfuscate-authorization: ${APP_TRAFFIC_OBFUSCATE_AUTHORIZATION:false}
    obfuscate-emails: ${APP_TRAFFIC_OBFUSCATE_EMAILS:false}
    obfuscate-sensitive-body-fields: ${APP_TRAFFIC_OBFUSCATE_SENSITIVE_BODY_FIELDS:false}
    legacy-public-access: ${APP_TRAFFIC_LEGACY_PUBLIC_ACCESS:false}
  
UserController:
  signin: Authenticates user and returns its JWT token.
  signup: Creates user and returns its JWT token
  delete: Deletes specific user by username
  search: Returns specific user by username
  me: Returns current user's data
  refresh: Refreshes token for logged in user
  getAll: Get all users
  edit: Edits user details

JmsSender:
  sendEmail: Sending email to Active MQ

ollama:
  base-url: http://localhost:11434

warehouse:
  # Alias of internal.service-tokens.warehouse, kept for existing deployments.
  service-token: ${WAREHOUSE_SERVICE_TOKEN:}

internal:
  # X-Service-Token secret per caller of the /internal/v1 API; a blank token disables that caller's endpoints (404).
  service-tokens:
    warehouse: ${warehouse.service-token:}
    # Also sent by the backend when it calls payment-service.
    payment: ${PAYMENT_SERVICE_TOKEN:}

payment:
  # payment-service: card refunds go to {base-url}/internal/v1/payments/refunds with the payment
  # service token; its payment results are signed with webhook-secret (X-Payment-Signature).
  base-url: ${PAYMENT_BASE_URL:http://payment-service:4004}
  webhook-secret: ${PAYMENT_WEBHOOK_SECRET:}
  refunds:
    # Delivers queued card refunds (see PaymentRefundJob).
    delivery:
      enabled: ${PAYMENT_REFUNDS_DELIVERY_ENABLED:true}
      interval: ${PAYMENT_REFUNDS_DELIVERY_INTERVAL:PT15S}

springdoc:
  # The service-to-service API for warehouse-service is not part of the public contract.
  packages-to-exclude: com.awesome.testing.internal
  paths-to-exclude: /internal/**
  # Controller responses are explicit; advice inference adds unreachable statuses and wrong bodies.
  override-with-generic-response: false
  swagger-ui:
    oauth2-redirect-url: ${SWAGGER_UI_OAUTH2_REDIRECT_URL:http://localhost:8081/swagger-ui/oauth2-redirect.html}
    # The warehouse and payment entries are warehouse-service's and payment-service's documents,
    # served by the gateway at /warehouse/v3/api-docs and /payment/v3/api-docs (absent when the
    # backend is called directly on 4001).
    urls:
      - name: OpenAPI JSON
        url: /v3/api-docs
      - name: OpenAPI YAML
        url: /v3/api-docs.yaml
      - name: Warehouse service
        url: /warehouse/v3/api-docs
      - name: Payment service
        url: /payment/v3/api-docs
    urls-primary-name: OpenAPI JSON

# The JMS health contributor is fixed at build time in the native image; with the local
# outbox there is no broker, so broker reachability is not part of application health.
management:
  # Endpoint beans are chosen at build time in the native image, so include them all here;
  # profiles narrow the published set at runtime (aitesters: health, info, prometheus).
  endpoints:
    web:
      exposure:
        include: "*"
  health:
    jms:
      enabled: false
