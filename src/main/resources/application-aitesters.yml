spring:
  # PostgreSQL with the same Flyway migrations as production; the sandbox database is disposable (tmpfs) and
  # its password comes from SPRING_DATASOURCE_PASSWORD.
  datasource:
    url: jdbc:postgresql://aitesters-postgres:5432/aitesters
    username: aitesters
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    validate-migration-naming: true
  autoconfigure:
    exclude:
      - org.springframework.boot.artemis.autoconfigure.ArtemisAutoConfiguration
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        id:
          new_generator_mappings: false
  jackson:
    serialization:
      indent-output: false

activemq:
  destination: email

server:
  port: 4001
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

security:
  jwt:
    token:
      secret-key: ${JWT_SECRET_KEY:local-development-jwt-key-change-me}
      expire-length: 3600000

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info,prometheus}

logging:
  level:
    root: INFO
    org.zalando.logbook: INFO

ollama:
  base-url: http://ollama-mock:11434

password-reset:
  frontend-base-url: ${PASSWORD_RESET_FRONTEND_BASE_URL:https://aitesters.byst.re/reset}
  token-ttl: 30m
  token-byte-length: 32
  expose-token-in-response: false
  local-outbox-enabled: true
  require-outbox-access-key: true
  outbox-access-key: ${LOCAL_EMAIL_OUTBOX_ACCESS_KEY:}

app:
  seed-demo-data:
    enabled: true
  sso:
    enabled: false
  traffic:
    obfuscate-authorization: true
    obfuscate-emails: true
    obfuscate-sensitive-body-fields: true
