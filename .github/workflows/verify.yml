name: Verify Application

on:
  push:
    # Tag pushes are excluded: they re-ran the full suite on a commit that the default-branch push had
    # already verified, and publish-image.yml verifies tagged releases itself.
    branches: ['**']

permissions:
  contents: read
  actions: read
  checks: write

# A newer push to the same branch supersedes an unfinished run. The default branch is never cancelled
# because release-train.py requires a completed successful run for its head commit.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

env:
  MAVEN_ARGS: -U

jobs:
  # A squash or merge commit on the default branch usually has the same git tree as the pull request
  # branch that already passed this workflow. Re-running ~13 minutes of identical checks proves nothing
  # new, so such a run concludes successfully without repeating them (publish-image.yml applies the same
  # rule to tagged releases). Branch pushes and trees that never passed are always fully verified.
  prior-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      verified: ${{ steps.lookup.outputs.verified }}
    steps:
      - name: Look for a successful run on the same git tree
        id: lookup
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REF_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          verified=false
          if [ "$REF_NAME" != "$DEFAULT_BRANCH" ]; then
            echo "Branch push: running the full verification."
          elif ! TREE=$(gh api "repos/$REPO/git/commits/$GITHUB_SHA" --jq .tree.sha) || [ -z "$TREE" ]; then
            echo "::warning::Could not read the tree of $GITHUB_SHA; running the full verification."
          elif ! match=$(TREE="$TREE" gh api "repos/$REPO/actions/workflows/verify.yml/runs?status=success&per_page=100" \
              --jq '.workflow_runs[] | select(.head_commit.tree_id == env.TREE and .head_sha != env.GITHUB_SHA) | .html_url'); then
            echo "::warning::Could not list successful runs; running the full verification."
          elif [ -n "$match" ]; then
            url=$(head -n 1 <<< "$match")
            echo "Tree $TREE already passed on another commit: $url"
            echo "Verification skipped: tree \`$TREE\` already passed in $url" >> "$GITHUB_STEP_SUMMARY"
            verified=true
          else
            echo "No successful run tested tree $TREE; running the full verification."
          fi
          echo "verified=$verified" >> "$GITHUB_OUTPUT"

  unit-tests:
    needs: prior-verification
    if: needs.prior-verification.outputs.verified != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@v6.3.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run unit tests with coverage
        run: ./mvnw clean verify

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0.24.4
        with:
          path: target
          format: cyclonedx-json
          artifact-name: backend-sbom.cdx.json

      - name: Publish Test Report
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@v3.2.0
        with:
          name: Test Results
          path: target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: false

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: jacoco-report
          path: |
            target/site/jacoco
            target/jacoco.exec
          retention-days: 7

      - name: Summarize coverage
        if: always()
        run: |
          if [ -f target/site/jacoco/jacoco.csv ]; then
            python3 scripts/coverage_summary.py --csv-path target/site/jacoco/jacoco.csv > coverage-summary.txt
            cat coverage-summary.txt >> "$GITHUB_STEP_SUMMARY"
          else
            echo "JaCoCo report not found" >> "$GITHUB_STEP_SUMMARY"
          fi

  integration-tests:
    needs: prior-verification
    if: needs.prior-verification.outputs.verified != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@v6.3.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
          cache-read-only: true

      # The unit tests already run in unit-tests; invoking failsafe directly skips re-running all
      # surefire tests (87 integration tests in ~80 s instead of ~200 s locally; the same 87 run in both forms).
      - name: Run integration profile
        run: ./mvnw -q -Pfast-verify,integration-tests test-compile failsafe:integration-test failsafe:verify

      - name: Publish Integration Test Report
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@v3.2.0
        with:
          name: Integration Test Results
          path: target/failsafe-reports/TEST-*.xml
          reporter: java-junit
          fail-on-error: false

  verify-local:
    needs: prior-verification
    if: needs.prior-verification.outputs.verified != 'true'
    runs-on: ubuntu-latest
    # The local profile runs on PostgreSQL with Flyway (localhost:5432/testdb, postgres/postgres).
    services:
      postgres:
        image: postgres:16.14-bookworm@sha256:92620daddcd947f8d5ab5ba66e848702fe443d87fed30c4cea8e389fd78dfc55
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d testdb"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@v6.3.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
          cache-read-only: true

      - name: Make scripts executable
        run: chmod +x scripts/verify-local.sh

      - name: Run local verification
        run: ./scripts/verify-local.sh

      - name: Upload app.log as artifact
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: app-log
          path: app.log
          retention-days: 1

  verify-docker:
    needs: prior-verification
    if: needs.prior-verification.outputs.verified != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@v6.3.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
          cache-read-only: true

      - name: Make scripts executable
        run: chmod +x scripts/verify-docker.sh

      - uses: docker/setup-buildx-action@v4.4.1

      # The dependency images (Ollama alone takes about a minute) download while the native image builds.
      # Started after the Buildx setup: pulling at the same time slowed that step from ~10 s to 98 s.
      - name: Start pulling the dependency images
        run: nohup docker compose pull --quiet --ignore-buildable > compose-pull.log 2>&1 &

      # The native compilation (~9 minutes) is one Dockerfile layer keyed by pom.xml, src/main and config.
      # A push that leaves them untouched (tests, docs, scripts, workflows) reuses the layer from an earlier
      # run on the same branch or on the default branch. publish-image.yml reads the same scope.
      - name: Build the native image with the layer cache
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          load: true
          tags: backend:verify-docker
          provenance: false
          cache-from: type=gha,scope=native-linux-amd64
          cache-to: type=gha,mode=max,scope=native-linux-amd64

      - name: Run Docker verification
        env:
          VERIFY_DOCKER_SKIP_BUILD: 'true'
        run: ./scripts/verify-docker.sh

      - name: Upload docker.log as artifact
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: docker-log
          path: docker.log
          retention-days: 1
