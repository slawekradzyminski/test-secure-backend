name: Publish container image

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: Immutable image tag, for example 3.8.0-rc.1
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: publish-backend-${{ github.ref }}
  cancel-in-progress: false

env:
  MAVEN_ARGS: -U
  GHCR_IMAGE: ghcr.io/${{ github.repository }}
  DOCKERHUB_IMAGE: docker.io/slawekradzyminski/backend

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      # The version probe must not reserve the full verification Maven cache key.
      - uses: actions/setup-java@v6.2.0
        with:
          java-version: '25'
          distribution: temurin

      - name: Validate release source and version
        id: release
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          git fetch --no-tags origin "$DEFAULT_BRANCH"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"; then
            echo "The release commit must belong to $DEFAULT_BRANCH." >&2
            exit 1
          fi

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$MANUAL_VERSION"
          else
            VERSION="${REF_NAME#v}"
          fi
          if ! printf '%s' "$VERSION" | grep --extended-regexp --quiet '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$'; then
            echo "Version must look like 3.8.0 or 3.8.0-rc.1." >&2
            exit 1
          fi

          PROJECT_VERSION=$(./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout)
          case "$VERSION" in
            "$PROJECT_VERSION"|"$PROJECT_VERSION"-*) ;;
            *)
              echo "Release $VERSION does not match Maven project version $PROJECT_VERSION." >&2
              exit 1
              ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  unit-tests:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.2.0
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
      - run: ./mvnw clean verify

  integration-tests:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.2.0
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
          cache-read-only: true
      - run: ./mvnw -q -Pfast-verify,integration-tests verify

  verify-local:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # The local profile runs on PostgreSQL with Flyway (localhost:5432/testdb, postgres/postgres).
    services:
      postgres:
        image: postgres:16.14-bookworm@sha256:92620daddcd947f8d5ab5ba66e848702fe443d87fed30c4cea8e389fd78dfc55
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d testdb"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.2.0
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
          cache-read-only: true
      - run: chmod +x scripts/verify-local.sh
      - run: ./scripts/verify-local.sh
      - name: Upload application log
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-app-log
          path: app.log
          retention-days: 7

  verify-docker:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.2.0
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
          cache-read-only: true
      - run: chmod +x scripts/verify-docker.sh
      - run: ./scripts/verify-docker.sh
      - name: Upload Docker log
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-docker-log
          path: docker.log
          retention-days: 7

  # native-image cannot cross-compile and is impractically slow under QEMU, so each platform is
  # built on a runner of its own architecture, pushed by digest, and merged into one manifest list.
  build:
    needs: [validate, unit-tests, integration-tests, verify-local, verify-docker]
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Validate Docker Hub credentials
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository secrets are required to publish." >&2
            exit 1
          fi

      - name: Prepare platform name
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4.7.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image labels
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
            ${{ env.DOCKERHUB_IMAGE }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.validate.outputs.version }}

      - name: Build and push native image by digest
        id: build
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,"name=${{ env.GHCR_IMAGE }},${{ env.DOCKERHUB_IMAGE }}",push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=native-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=native-${{ env.PLATFORM_PAIR }}
          provenance: mode=max
          sbom: true

      - name: Smoke test the native image
        env:
          IMAGE: ${{ env.GHCR_IMAGE }}@${{ steps.build.outputs.digest }}
        run: scripts/native-smoke.sh "$IMAGE"

      - name: Export platform digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload platform digest
        uses: actions/upload-artifact@v7.0.2
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [validate, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download platform digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4.7.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
            ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=raw,value=${{ needs.validate.outputs.version }}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
          flavor: |
            latest=false

      - name: Create and push multi-platform manifest lists
        id: manifest
        working-directory: ${{ runner.temp }}/digests
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          for image in "$GHCR_IMAGE" "$DOCKERHUB_IMAGE"; do
            tags=()
            while IFS= read -r tag; do tags+=(--tag "$tag"); done < <(
              jq -r --arg image "$image" '.tags[] | select(startswith($image + ":"))' <<< "$DOCKER_METADATA_OUTPUT_JSON")
            sources=()
            for digest in *; do sources+=("${image}@sha256:${digest}"); done
            docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          done
          digest="$(docker buildx imagetools inspect "${GHCR_IMAGE}:${VERSION}" --format '{{json .Manifest}}' | jq -r .digest)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Record published digest
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Published backend image

          - Version: `${{ needs.validate.outputs.version }}`
          - Digest: `${{ steps.manifest.outputs.digest }}`
          - Image: GraalVM native executable (JVM fallback: `Dockerfile.jvm`, not published)
          - Platforms: `linux/amd64`, `linux/arm64` (built natively per architecture)
          EOF
